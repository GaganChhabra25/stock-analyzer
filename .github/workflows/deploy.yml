name: Deploy to Server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "ERROR: SERVER_HOST secret is not set" && exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "ERROR: SERVER_USER secret is not set" && exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "ERROR: SERVER_SSH_KEY secret is not set" && exit 1; fi
          if [ -z "${{ secrets.GH_PAT }}" ]; then echo "ERROR: GH_PAT secret is not set" && exit 1; fi
          echo "All secrets are present"

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" bash -s << ENDSSH
            set -e
            DEPLOY_DIR=/home/stockapp/stock-analyzer
            VENV=\$DEPLOY_DIR/venv

            # Fix DNS if needed
            grep -q "8.8.8.8" /etc/resolv.conf || echo "nameserver 8.8.8.8" >> /etc/resolv.conf

            # Install Docker if not present
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              usermod -aG docker stockapp
              systemctl enable docker
              systemctl start docker
            fi

            # Pull latest code
            if [ ! -d \$DEPLOY_DIR/.git ]; then
              sudo -u stockapp git clone https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git \$DEPLOY_DIR
            else
              chown -R stockapp:stockapp \$DEPLOY_DIR/.git
              sudo -u stockapp git -C \$DEPLOY_DIR fetch https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git master
              sudo -u stockapp git -C \$DEPLOY_DIR reset --hard FETCH_HEAD
            fi

            # ── Web app ──────────────────────────────────────────────────────
            sudo -u stockapp \$VENV/bin/pip install -r \$DEPLOY_DIR/requirements.txt -q
            systemctl restart stock-analyzer
            # Update system crontab (stays active until cutover.sh is run)
            crontab -u stockapp \$DEPLOY_DIR/deploy/contabo/crontab

            # ── Cron worker Docker image (build only, not started yet) ───────
            # System cron keeps running. Run deploy/contabo/cutover.sh manually
            # to migrate DB + start Docker cron + remove system crontab.
            cd \$DEPLOY_DIR
            docker compose build cron-worker

            echo "Deployed at \$(date) — system cron active, Docker image ready"
          ENDSSH
