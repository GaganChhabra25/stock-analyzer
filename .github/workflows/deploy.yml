name: Deploy to Server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_PAT
          script: |
            set -e
            DEPLOY_DIR=/home/gagan_chhabra1990/stock-analyzer
            DEPLOY_USER=gagan_chhabra1990
            if [ ! -d $DEPLOY_DIR ]; then
              sudo -u $DEPLOY_USER git clone https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git $DEPLOY_DIR
            fi
            sudo -u $DEPLOY_USER git -C $DEPLOY_DIR pull https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git
            if [ ! -f $DEPLOY_DIR/venv/bin/pip ]; then
              sudo apt-get install -y python3-venv -q
              sudo -u $DEPLOY_USER python3 -m venv $DEPLOY_DIR/venv
            fi
            sudo -u $DEPLOY_USER $DEPLOY_DIR/venv/bin/pip install -r $DEPLOY_DIR/requirements.txt -q
            sudo systemctl restart stock-analyzer
            echo "Deployed successfully at $(date)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
