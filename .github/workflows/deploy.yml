name: Deploy to Server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            if [ ! -d ~/stock-analyzer ]; then
              GIT_TERMINAL_PROMPT=0 git clone https://github.com/GaganChhabra25/stock-analyzer.git ~/stock-analyzer
            fi
            cd ~/stock-analyzer
            git pull
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            venv/bin/pip install -r requirements.txt -q
            sudo systemctl restart stock-analyzer
            echo "Deployed successfully at $(date)"
