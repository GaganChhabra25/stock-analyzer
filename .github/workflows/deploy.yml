name: Deploy to Server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "ERROR: SERVER_HOST secret is not set" && exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "ERROR: SERVER_USER secret is not set" && exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "ERROR: SERVER_SSH_KEY secret is not set" && exit 1; fi
          if [ -z "${{ secrets.GH_PAT }}" ]; then echo "ERROR: GH_PAT secret is not set" && exit 1; fi
          echo "All secrets are present"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          envs: GH_PAT
          script: |
            set -e
            DEPLOY_DIR=$HOME/stock-analyzer
            if [ ! -d $DEPLOY_DIR ]; then
              git clone https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git $DEPLOY_DIR
            fi
            git -C $DEPLOY_DIR pull https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git
            if [ ! -f $DEPLOY_DIR/venv/bin/pip ]; then
              sudo apt-get install -y python3-venv -q
              python3 -m venv $DEPLOY_DIR/venv
            fi
            $DEPLOY_DIR/venv/bin/pip install -r $DEPLOY_DIR/requirements.txt -q
            sudo systemctl restart stock-analyzer
            echo "Deployed successfully at $(date)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
