name: Deploy to Server

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_PAT
          script: |
            set -e
            DEPLOY_DIR=/home/gagan_chhabra1990/stock-analyzer
            if [ ! -d $DEPLOY_DIR ]; then
              git clone https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git $DEPLOY_DIR
            fi
            cd $DEPLOY_DIR
            git pull https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git
            if [ ! -f venv/bin/pip ]; then
              sudo apt-get install -y python3-venv -q
              rm -rf venv
              python3 -m venv venv
            fi
            venv/bin/pip install -r requirements.txt -q
            sudo systemctl restart stock-analyzer
            echo "Deployed successfully at $(date)"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
