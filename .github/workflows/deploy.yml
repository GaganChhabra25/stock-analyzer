name: Deploy to Server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: stock-analyzer-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "ERROR: SERVER_HOST secret is not set" && exit 1; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "ERROR: SERVER_USER secret is not set" && exit 1; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "ERROR: SERVER_SSH_KEY secret is not set" && exit 1; fi
          if [ -z "${{ secrets.GH_PAT }}" ]; then echo "ERROR: GH_PAT secret is not set" && exit 1; fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine affected production processes
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            python deploy/contabo/deploy_targets.py --all >> "$GITHUB_OUTPUT"
          else
            mapfile -t changed < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            python deploy/contabo/deploy_targets.py "${changed[@]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy exact commit via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_SHA: ${{ github.sha }}
          DEPLOY_WEB: ${{ steps.plan.outputs.web }}
          DEPLOY_SERVICES: ${{ steps.plan.outputs.services }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -z "$DEPLOY_SERVICES" ]; then DEPLOY_SERVICES=none; fi

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USER@$HOST" \
            bash -s -- "$TARGET_SHA" "$DEPLOY_WEB" "$DEPLOY_SERVICES" "$GH_PAT" <<'ENDSSH'
          set -Eeuo pipefail
          TARGET_SHA="$1"
          DEPLOY_WEB="$2"
          DEPLOY_SERVICES="$3"
          GH_PAT="$4"
          DEPLOY_DIR=/home/stockapp/stock-analyzer
          VENV="$DEPLOY_DIR/venv"

          command -v docker >/dev/null
          [ -d "$DEPLOY_DIR/.git" ] || {
            echo "ERROR: production repository is missing; bootstrap it explicitly" >&2
            exit 1
          }

          # Never silently destroy a manual production hotfix. Line-ending-only
          # drift is ignored, but any meaningful tracked change blocks deploy.
          if ! git -C "$DEPLOY_DIR" diff --quiet --ignore-space-at-eol || \
             ! git -C "$DEPLOY_DIR" diff --cached --quiet; then
            echo "ERROR: meaningful uncommitted production changes detected" >&2
            git -C "$DEPLOY_DIR" status --short >&2
            exit 1
          fi

          PREVIOUS_SHA="$(git -C "$DEPLOY_DIR" rev-parse HEAD)"
          chown -R stockapp:stockapp "$DEPLOY_DIR/.git"
          sudo -u stockapp git -C "$DEPLOY_DIR" fetch \
            "https://x-access-token:${GH_PAT}@github.com/GaganChhabra25/stock-analyzer.git" master
          FETCHED_SHA="$(git -C "$DEPLOY_DIR" rev-parse FETCH_HEAD)"
          [ "$FETCHED_SHA" = "$TARGET_SHA" ] || {
            echo "ERROR: fetched $FETCHED_SHA but workflow requested $TARGET_SHA" >&2
            exit 1
          }
          sudo -u stockapp git -C "$DEPLOY_DIR" reset --hard "$TARGET_SHA"

          SERVICE_ARGS=()
          if [ "$DEPLOY_SERVICES" != "none" ]; then
            read -r -a SERVICE_ARGS <<< "$DEPLOY_SERVICES"
          fi
          DEPLOY_DIR="$DEPLOY_DIR" VENV="$VENV" \
            bash "$DEPLOY_DIR/deploy/contabo/deploy_release.sh" \
              "$PREVIOUS_SHA" "$TARGET_SHA" "$DEPLOY_WEB" "${SERVICE_ARGS[@]}"
          ENDSSH
