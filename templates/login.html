<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Analyzer — Sign In</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 16px;
  padding: 48px 40px 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}
.logo { font-size: 40px; margin-bottom: 16px; }
h1 {
  font-size: 22px;
  font-weight: 700;
  color: #f0f6fc;
  margin-bottom: 6px;
}
.subtitle {
  font-size: 13px;
  color: #8b949e;
  margin-bottom: 32px;
  line-height: 1.6;
}
.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 13px 20px;
  background: #ffffff;
  color: #3c4043;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 0.2px;
  transition: box-shadow 0.2s, background 0.2s;
  border: 1px solid #dadce0;
}
.google-btn:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  background: #f8f8f8;
}
.google-btn svg { flex-shrink: 0; }
.divider {
  margin: 28px 0 20px;
  border: none;
  border-top: 1px solid #21262d;
}
.restricted {
  font-size: 11px;
  color: #484f58;
  line-height: 1.6;
}
.restricted span { color: #58a6ff; }
.error-box {
  background: #2d1b1b;
  border: 1px solid #6e2d2d;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 24px;
  font-size: 12px;
  color: #f85149;
  text-align: left;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📊</div>
  <h1>Stock Analyzer</h1>
  <p class="subtitle">
    Personal portfolio &amp; market screener<br>
    Sign in to access your reports
  </p>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <a href="/auth/google" class="google-btn">
    <!-- Google "G" logo -->
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Sign in with Google
  </a>

  <hr class="divider">
  <p class="restricted">
    Access is restricted to <span>specific accounts only</span>.<br>
    Contact the admin if you need access.
  </p>
</div>
</body>
</html>
