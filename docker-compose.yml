version: '3.9'

# =============================================================================
# Stock Analyzer — Cron Worker + PostgreSQL
#
# First-time setup:  see deploy/contabo/MIGRATE.md
# Start:             docker compose up -d
# Logs:              docker compose logs -f cron-worker
# DB shell:          docker compose exec postgres psql -U stockanalyzer stock_analyzer
# =============================================================================

services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_analyzer
      POSTGRES_USER: ${POSTGRES_USER:-stockanalyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed on 5433 to avoid conflict with existing host postgres during migration.
      # After full migration, change to 5432:5432 if desired.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockanalyzer} -d stock_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5

  cron-worker:
    image: stock-analyzer-cron-worker:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/cron-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # crontab.docker is written in IST. Overrides the Dockerfile's
      # Europe/Berlin for this service only, so Berlin DST changes can no
      # longer shift job times (2026-10-28 incident: Kite login slipped to 09:30 IST).
      TZ: Asia/Kolkata
      # Override localhost → postgres container hostname
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockanalyzer}:${POSTGRES_PASSWORD}@postgres:5432/stock_analyzer
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  # CRUDEOIL 1-second WebSocket daemon — persistent process, not cron-based
  crudeoil-ws:
    image: stock-analyzer-crudeoil-ws:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/cron-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockanalyzer}:${POSTGRES_PASSWORD}@postgres:5432/stock_analyzer
      DB_HOST: postgres
      DB_PORT: "5432"
    command: ["python", "-u", "options/crudeoil_ws.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  # MCX GOLD front-future 1-second OHLC (added 2026-11-25). Separate process and
  # Kite connection, so a GOLD failure can never interrupt CRUDEOIL collection.
  gold-ws:
    image: stock-analyzer-gold-ws:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/cron-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockanalyzer}:${POSTGRES_PASSWORD}@postgres:5432/stock_analyzer
      DB_HOST: postgres
      DB_PORT: "5432"
    command: ["python", "-u", "options/gold_ws.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  # NIFTY weekly options (ATM ±10) + near-month futures, one DB snapshot/second.
  # Isolated from MCX so restarts or failures cannot interrupt CRUDEOIL/NG.
  nifty-ws:
    profiles: ["nifty-disabled"]  # NIFTY collection stopped 2026-10-21 (crude-only)
    image: stock-analyzer-nifty-ws:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/cron-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockanalyzer}:${POSTGRES_PASSWORD}@postgres:5432/stock_analyzer
      DB_HOST: postgres
      DB_PORT: "5432"
    command: ["python", "-u", "options/nifty_ws.py"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
