# Nginx reverse proxy config for Stock Analyzer
# Place at: /etc/nginx/sites-available/stock-analyzer
# Then: sudo ln -s /etc/nginx/sites-available/stock-analyzer /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP with your Oracle Cloud public IP or domain name.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # allow long-running analysis jobs
    }
}

# After setting up HTTPS with Let's Encrypt (certbot), the above block is
# replaced automatically and a redirect from 80→443 is added.
# Command: sudo certbot --nginx -d YOUR_DOMAIN
